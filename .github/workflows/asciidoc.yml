on:
  push:
    paths:
      - "DC-*"
      - "adoc/**"
      - ".github/workflows/*"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "DC-*"
      - "adoc/**"
      - ".github/workflows/*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    outputs:
      affected_dcs: ${{ steps.set-output.outputs.affected_dcs }}
      has_changes: ${{ steps.set-output.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Detect affected DC files
        id: set-output
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.event.after }}"
            if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE_SHA" ] || ! git rev-parse --quiet --verify "$BASE_SHA" >/dev/null 2>&1; then
              BASE_SHA="HEAD^"
            fi
          fi
          
          echo "Comparing $BASE_SHA to $HEAD_SHA"
          CHANGED_FILES=$(git diff --name-only $BASE_SHA $HEAD_SHA)
          
          AFFECTED=$(echo "$CHANGED_FILES" | uv run scripts/detect-affected-dcs.py)
          echo "Affected DC files: $AFFECTED"
          
          if [ -z "$AFFECTED" ]; then
            echo "affected_dcs=" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "affected_dcs=$AFFECTED" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  validate:
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: openSUSE/doc-ci@gha-validate
        with:
          dc-files: ${{ needs.detect.outputs.affected_dcs }}
          validate-ids: true
          validate-images: true
          validate-tables: true

  build:
    runs-on: ubuntu-latest
    needs: [detect, validate]
    if: needs.detect.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Cache DAPS Build Directory
        uses: actions/cache@v4
        with:
          path: build/
          key: ${{ runner.os }}-daps-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-daps-${{ github.ref_name }}-
            ${{ runner.os }}-daps-
      - name: Prune Unaffected Cache Directories
        run: |
          if [ -d "build" ]; then
            echo "Pruning unaffected cached build directories..."
            AFFECTED_DCS="${{ needs.detect.outputs.affected_dcs }}"
            for dc in DC-*; do
              if [ -f "$dc" ]; then
                # Convert e.g., 'DC-releasenotes_sles_16.1' to 'releasenotes_sles_16.1'
                prod_dir=$(echo "$dc" | sed 's/^DC-//')
                if [[ ! " $AFFECTED_DCS " =~ " $dc " ]]; then
                  if [ -d "build/$prod_dir" ]; then
                    echo "Deleting unaffected cached directory: build/$prod_dir"
                    rm -rf "build/$prod_dir"
                  fi
                fi
              fi
            done
          fi
      - uses: openSUSE/doc-ci@gha-build
        id: build-dc
        with:
          dc-files: ${{ needs.detect.outputs.affected_dcs }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-dc.outputs.artifact-name }}
          path: ${{ steps.build-dc.outputs.artifact-dir }}/*
          retention-days: 3

  publish:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.detect.outputs.has_changes == 'true'
    needs: [detect, build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Downloading all build artifacts
        id: download-artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifact-dir
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Create folder hierarchy for susedoc.github.io
        run: uv run --with pyyaml scripts/build-fleet.py
      - name: Publishing builds on susedoc.github.io
        uses: openSUSE/doc-ci@lukas-gha-publish-dir
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        with:
          artifact-path:  artifact-dir
          publish-repo: gh:SUSEdoc/release-notes.git
          repo-reset-after: 35
          publish-dir: "root"

  preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.detect.outputs.has_changes == 'true'
    permissions:
      pull-requests: write
      issues: write
    needs: [detect, build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Downloading all build artifacts
        id: download-artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifact-dir
      - name: Create folder hierarchy for preview
        run: uv run --with pyyaml scripts/build-fleet.py "preview" "https://susedoc.github.io/release-notes/pr-${{ github.event.pull_request.number }}/sles-16.0/html/release-notes/"
      - name: Publishing preview on susedoc.github.io
        uses: openSUSE/doc-ci@lukas-gha-publish-dir
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        with:
          artifact-path:  artifact-dir
          publish-repo: gh:SUSEdoc/release-notes.git
          repo-reset-after: 0
          publish-dir: "pr-${{ github.event.pull_request.number }}"
      - name: Comment on PR with preview link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --with pyyaml scripts/comment-pr-preview.py "${{ github.event.pull_request.number }}" "${{ github.repository }}"

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Remove PR Preview Folder (Shallow Clone)
        run: |
          git config --global user.name "SUSE Docs Bot"
          git config --global user.email "doc-team+docbot@suse.com"
          
          # Perform an extremely fast, shallow, single-branch clone of only the latest commit of gh-pages
          git clone --branch gh-pages --single-branch --depth 1 git@github.com:SUSEdoc/release-notes.git local-gh-pages
          
          cd local-gh-pages
          pr_dir="pr-${{ github.event.pull_request.number }}"
          if [ -d "$pr_dir" ]; then
            echo "Deleting preview directory: $pr_dir"
            rm -rf "$pr_dir"
            git add -A .
            git commit -m "CI: Clean up preview directory for closed PR #${{ github.event.pull_request.number }}"
            git push origin gh-pages
          else
            echo "No preview directory found for PR #${{ github.event.pull_request.number }}."
          fi
