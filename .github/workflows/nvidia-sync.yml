name: Sync NVIDIA Kernel Patches

on:
  schedule:
    - cron: '0 2 * * *'  # Runs nightly at 02:00 UTC
  workflow_dispatch:      # Allows manual trigger via GitHub Actions UI or gh CLI

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release-notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Configure Git Author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run patch sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/sync-nvidia-patches.sh
